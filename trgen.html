<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Truck Roll Generator</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Creepster&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/trgen.css">

</head>

<body>

  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <img src="Assets/happythanksgivingsister-happy.gif"
          alt="Turkey dancing back and forth and happy">
      <a class="navbar-brand pageTitle" href="#">Notes Generator</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <div class="container d-flex h-100">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 w-50">
              <li class="nav-item">
                <a class="nav-link" href="index.html">Case</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="trgen.html">Truck Roll</a>
              </li>
              <li class="nav-item">
                <a class="nav-link">TBD</a>
              </li>
            </ul>
          </div>
      </div>
    </div>
  </nav>

  <div class="container main">
    <div class="container-fluid text-left">
      <div class="row" style="height: 80vh;">
        <div class="col-8">
          <form>
            <div class="input-group mb-3">
              <p class="container">
                <label for="trReason" class="form-label areaLabel m-0">Truck Roll Reason</label>
                <button type="button" class="btn btnMain1 btn-sm" data-bs-toggle="button">Misc/Retention</button>
              </p>
              <div class="container d-flex">
                <div class="form-floating w-75">
                  <select class="form-select form-select-sm" id="trReaSel" aria-label="trReaSel">
                    <option value=" "></option>
                    <option value="hdONT">Hard Down ONT</option>
                    <option value="cutFiber">Cut Fiber Line</option>
                    <option value="dmgPatch">Damaged Patch Cable</option>
                    <option value="lowLight">Low Light Levels</option>
                    <option value="swapRouters">Faulty Routers/Swap</option>
                    <option value=""></option>
                    <option value=""></option>
                    <option value=""></option>
                    <option value=""></option>
                  </select>
                  <label for="trReaSel">Select an option to prefill the fields</label>
                </div>
              </div>
            </div>

            <div class="container mb-3">
              <label for="cxState" class="form-label areaLabel m-0">Customer Statement</label>
              <input type="text" class="form-control textArea w-75" id="cxState">
            </div>

            <div class="container mb-3">
              <label for="tsSteps" class="form-label areaLabel m-0">Troubleshooting Steps/Additional Info</label>
              <textarea class="form-control textArea w-75" id="tsSteps" rows="4"></textarea>
            </div>
            <div class="container d-flex align-items-center mb-3 gap-2">
                <label for="numDisp" class="areaLabel" ># of Dispatches?</label>
                <input type="text" class="form-control form-control-sm textArea" id="numDisp" style="width:7%;">
            </div>
            <div class="container mb-1">
              <p class="d-flex align-items-center gap-2">
                <label for="ontStats" class="areaLabel">ONT Stats</label>
                <button type="button" class="btn btnMain1 btnSecn btn-sm" id="btnPaste"><i class="bi bi-clipboard2-plus-fill"></i></button>
              </p>
              <textarea class="form-control textArea w-75" rows="4" id="ontStats"></textarea>
            </div>
            <div class="mt-3">
              <button type="button" class="btn btnMain1" id="genBut"
                style="margin-bottom: 10px;">Generate</button>
            </div>
          </form>
        </div>
        <div class="col-4 d-flex flex-column">
          <textarea class="flex-grow-1" id="generatedNote" disabled></textarea>
          <div class="container">
            <div class="row justify-content-between">
              <div class="col-4"><button type="button" class="btn btnMain1 w-100" id="copyNote">Copy</button></div>
              <div class="col-4"><button type="button" class="btn btnMain1 w-100" id="clearAll">Clear</button></div>
            </div>
          </div>
        </div>
      </div>

    </div>


  </div> 

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/trgen.js"></script>

</body>

</html>
