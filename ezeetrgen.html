<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truck Roll Generator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Creepster&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/trgen.css">
    <link rel="stylesheet" href="css/trgenezee.css">

</head>

<body>
<div class="container-fluid main" style="padding: 0px;">
        <div class="container-fluid cont-top">
            <div class="d-flex align-items-center">
                <img src="Assets/ezgif.com-crop.gif" alt="Turkey dancing back and forth and happy" style="width: 75px; height: 50px;">
                <a class="navbar-brand pageTitle" href="#">Notes Generator</a>
            </div>
        </div>
        <div class="container-fluid row mainrow" style="min-width: 100vh; min-height: 90vh;">
            <div class="sidemenu" style="border: 1px black solid">
                    <ul class="navbar-nav nav-fill me-auto mb-2 mb-lg-0 w-50 smcont">
                        <li class="nav-item smitem">
                            <a class="nav-link justify-content-center gap-1" href="index.html"><i class="bi bi-journal-check"></i>Case</a>
                        </li>
                        <li class="nav-item smitem">
                            <a class="nav-item btn smitem nav-button justify-content-center active gap-1" data-bs-toggle="button" aria-current="page"><i class="bi bi-truck"></i>Truck Roll</a>
                        </li>
                        <li class="nav-item smitem">
                            <a class="nav-link justify-content-center gap-1">TBD</a>
                        </li>
                    </ul>
            </div>
            <div class="col mainnotes" style="padding: 2rem; padding-top: 1rem">
                <div class="row" style="height: 80vh;">
                    <div class="col-8">
                        <form>
                            <div class="input-group mb-3">
                                <p class="container">
                                    <label for="trReason" class="form-label areaLabel m-0">Truck Roll Reason</label>
                                    <!-- <button type="button" class="btn btnMain1 btn-sm" data-bs-toggle="button">Misc/Retention</button> -->
                                </p>
                                <div class="container d-flex">
                                    <div class="form-floating w-75">
                                        <select class="form-select form-select-sm" id="trReaSel" aria-label="trReaSel">
                                            <option value=" "></option>
                                            <option value="hdONT">Hard Down ONT</option>
                                            <option value="cutFiber">Cut Fiber Line</option>
                                            <option value="dmgPatch">Damaged Patch Cable</option>
                                            <option value="lowLight">Low Light Levels</option>
                                            <option value="swapRouters">Faulty Routers/Swap</option>
                                            <option value="repONT">Reposition Modem</option>
                                            <option value="rouFlap">Routers Flapping/Crashing</option>
                                        </select>
                                        <label for="trReaSel">Select an option to prefill the fields</label>
                                    </div>
                                </div>
                            </div>

                            <div class="container mb-3">
                                <label for="cxState" class="form-label areaLabel m-0">Customer Statement</label>
                                <input type="text" class="form-control textArea w-75" id="cxState">
                            </div>

                            <div class="container mb-3">
                                <label for="tsSteps" class="form-label areaLabel m-0">Troubleshooting Steps/Additional
                                    Info</label>
                                <textarea class="form-control textArea w-75" id="tsSteps" rows="8"></textarea>
                            </div>
                            <div class="container d-flex align-items-center mb-3 gap-2">
                                <label for="numDisp" class="areaLabel"># of Dispatches?</label>
                                <input type="number" class="form-control form-control-sm textArea" id="numDisp" min="0"
                                    step="1" style="width:7%;">
                                <div class="btn-group" role="group" aria-label="First group">
                                    <button type="button" class="btn btnMain1 btn-sm" name="dispBtn"
                                        value="0">0</button>
                                    <button type="button" class="btn btnMain1 btn-sm" name="dispBtn"
                                        value="1">1</button>
                                    <button type="button" class="btn btnMain1 btn-sm" name="dispBtn"
                                        value="2">2</button>
                                    <button type="button" class="btn btnMain1 btn-sm" name="dispBtn"
                                        value="3">3</button>
                                </div>
                                <button type="button" class="btn btnSwitch" data-bs-toggle="button"
                                    id="bswtUsable"></button>
                            </div>
                            <div class="container mb-1">
                                <p class="d-flex align-items-center gap-2">
                                    <label for="ontStats" class="areaLabel">ONT Stats</label>
                                    <button type="button" class="btn btnMain1 btnSecn btn-sm" id="btnPaste"><i
                                            class="bi bi-clipboard2-plus-fill"></i></button>
                                </p>
                                <textarea class="form-control textArea w-75" rows="4" id="ontStats"></textarea>
                            </div>
                            <div class="mt-3">
                                <button type="button" class="btn btnMain1" id="genBut"
                                    style="margin-bottom: 10px;">Generate</button>
                            </div>
                        </form>
                    </div>
                    <div class="col-4 d-flex flex-column">
                        <textarea class="flex-grow-1" id="generatedNote" disabled>Unusable

Cx Statement: 

Troubleshooting steps:


# of dispatches: 

ONT Stats:


          </textarea>
                        <div class="container">
                            <div class="row justify-content-between">
                                <div class="col-4"><button type="button" class="btn btnMain1 w-100"
                                        id="copyNote">Copy</button></div>
                                <div class="col-4"><button type="button" class="btn btnMain1 w-100"
                                        id="clearAll">Clear</button></div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/trgen.js"></script>

</body>

</html>
