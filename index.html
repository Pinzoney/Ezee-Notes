<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truck Roll Generator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Creepster&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/addmainnotes.css">

</head>

<body>
    <div class="container-fluid main" style="padding: 0px;">
        <div class="container-fluid cont-top">
            <div class="d-flex align-items-center">
                <img src="Assets/ezgif.com-crop.gif" alt="Turkey dancing back and forth and happy"
                    style="width: 75px; height: 50px;">
                <a class="navbar-brand pageTitle" href="#">Note Generator</a>
            </div>
        </div>
        <div class="container-fluid row mainrow" style="min-width: 100vh; min-height: 90vh;">
            <div class="sidemenu">
                <ul class="navbar-nav nav-fill mb-lg-0 smcont">
                    <li class="nav-item smitem">
                        <a class="nav-link active justify-content-center gap-1" href="index.html"><i
                                class="bi bi-journal-check"></i>Case</a>
                    </li>
                    <li class="nav-item smitem">
                        <a class="nav-link justify-content-center gap-1" aria-current="page" href="trgen.html"><i
                                class="bi bi-truck"></i>Truck Roll</a>
                    </li>
                    <li class="nav-item smitem">
                        <a class="nav-link justify-content-center gap-1">TBD</a>
                    </li>
                </ul>
            </div>
            <div class="col mainnotes" style="padding: 1rem; padding-top: 1rem">
                <div class="row" style="height: 80vh;">
                    <div class="col-8">

                        <!-- //T2 Type buttons -->

                        <div class="row mb-3" style="display: flexbox; justify-content:center; align-items:center ">
                            <div>
                                <div class="d-flex gap-1" role="group">
                                    <input type="radio" class="btn-check" name="btnT2Type" id="npsCase"
                                        data-line="T2 NPS Case Review" autocomplete="off" checked>
                                    <label class="btn btnRadioType" for="npsCase">NPS Case</label></input>
                                    <input type="radio" class="btn-check" name="btnT2Type" id="trAudit"
                                        data-line="T2 Truck Roll Audit Review" autocomplete="off">
                                    <label class="btn btnRadioType" for="trAudit">TR Audit</label></input>
                                    <input type="radio" class="btn-check" name="btnT2Type" id="t2Chat"
                                        data-line="T2 Support Request review (Chat)" autocomplete="off">
                                    <label class="btn btnRadioType" for="t2Chat">T2 Chat Support</label></input>
                                </div>
                            </div>
                        </div>

                        <div class="form-floating col-2 caseNumField">
                            <input type="text" class="form-control" placeholder="Case #" id="caseNum">
                            <label for="caseNum" style="font-size: smaller; padding: 0.59rem 0.5rem;">Case #:</label>
                        </div>

                        <form>
                            <div class="mt-4">
                                <label for="inputIssue" class="form-label areaLabel">Issue</label>
                                <div class="input-group mb-3 align-items-center">
                                    <div class="w-50">
                                        <input type="text" class="form-control textArea" id="inputIssue"
                                            placeholder="Type a short description of the issue.">
                                    </div>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="tsSteps" class="form-label areaLabel">Troubleshooting Steps
                                    Done</label>
                                <div class="row">
                                    <div class="col-7" style="padding-right: 0px;">
                                        <textarea class="form-control textArea" id="tsSteps" rows="7"></textarea>
                                    </div>                               </div>
                            </div>
                            <div class="mt-3">
                                <button type="button" class="btn btnMain1" id="genBut"
                                    style="margin-bottom: 10px;">Generate</button>
                            </div>
                        </form>
                    </div>
                    <div class="col-4 d-flex flex-column">
                        <textarea class="flex-grow-1" id="generatedNote">
T2 NPS Case Review

Case #: 

Cx Statement: 

Troubleshooting steps:

                        </textarea>
                        <div class="container">
                            <div class="row justify-content-between">
                                <div class="col-4"><button type="button" class="btn btnMain1 w-100"
                                        id="copyNote">Copy</button></div>
                                <div class="col-4"><button type="button" class="btn btnMain1 w-100"
                                        id="clearAll">Clear</button></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"> </script>
    <script src="js/tsnotes.js">
        // wait for five-server to connect
        const five = document.querySelector('[data-id="five-server"]');
        if (five) five.addEventListener("connected", main);
        else window.addEventListener("load", main);
    </script>

</body>

</html>
